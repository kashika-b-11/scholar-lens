# ==============================================================================
# ScholarLens Configuration File
# Project: Research Paper Digest & Claim Verification Copilot
# ==============================================================================

app:
  title: "ScholarLens: Research Paper Digest & Claim Verification Copilot"
  version: "1.0.0"
  description: "An NLP pipeline integrating LLMs to summarize academic papers, verify empirical claims, and simplify complex terminology."

# LLM Provider & Generation Hyperparameters
llm:
  # Supported providers: "gemini" (recommended, free tier) or "openai"
  default_provider: "gemini"
  
  # Google Gemini settings
  gemini:
    model: "gemini-2.0-flash" # High speed, 1M context window, state-of-the-art reasoning
    fallback_model: "gemini-1.5-flash"
    temperature: 0.2          # Low temperature ensures factual adherence and prevents hallucination
    top_p: 0.95
    max_output_tokens: 3000
    timeout_seconds: 45
    max_retries: 3

  # OpenAI / Compatible alternative settings
  openai:
    model: "gpt-4o-mini"
    temperature: 0.2
    max_output_tokens: 3000
    timeout_seconds: 45
    max_retries: 3

# Document Processing Constraints
document:
  max_character_limit: 80000 # ~20,000 tokens
  min_character_limit: 300   # Minimum text length to analyze
  allowed_file_types:
    - "pdf"
    - "txt"
    - "md"

# NLP Pipeline Flags
pipeline:
  enable_executive_summary: true
  enable_claim_verification: true
  enable_jargon_decoder: true
  enable_methodology_audit: true
  enable_grounded_qa: true
